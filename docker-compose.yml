# Freebie Radar - Portainer Git stack, single container, host:container 18895:18895.
# 18894 is allocated to SpiderFoot. Confirm 18895 is actually free on this Docker host.
# LAN-only: do not forward this port to the internet.
# The image below is upstream's published image; this fork controls Compose settings.
services:
  radar:
    image: ${RADAR_IMAGE:-zichuanlan/freebie-radar:latest}
    restart: unless-stopped
    mem_limit: 512m

    ports:
      - "${LAN_IP:?SET_DOCKER_HOST_LAN_IP}:${RADAR_HOST_PORT:-18895}:18895/tcp"

    environment:
      NODE_ENV: "production"
      HOST: "0.0.0.0"
      PORT: "18895"
      DATABASE_PATH: "/data/radar.db"
      TZ: "Asia/Ho_Chi_Minh"
      SITE_MODE: "selfhost"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?SET_STRONG_ADMIN_TOKEN}"
      ENABLE_SCHEDULER: "true"
      PUSH_CHANNEL: "none"
      TRUST_PROXY: "false"
      WEBHOOK_ALLOW_PRIVATE: "false"

    volumes:
      - radar_data:/data

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18895/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  radar_data:
